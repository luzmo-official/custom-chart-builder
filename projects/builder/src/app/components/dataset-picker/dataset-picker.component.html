<div class="dataset-dropdown-container">
  <button
    #trigger
    type="button"
    class="dataset-trigger"
    [class.open]="isOpen"
    [title]="triggerLabel"
  >
    <span class="dataset-trigger-label">{{ triggerLabel }}</span>
    <svg
      class="dataset-trigger-icon"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>

  <luzmo-overlay
    [triggerElement]="trigger"
    triggerInteraction="click"
    type="auto"
    placement="bottom-start"
    receivesFocus="false"
    (luzmo-opened)="onOpened()"
    (luzmo-closed)="onClosed()"
  >
    <luzmo-popover class="dataset-popover">
      <div class="dataset-panel">
        <div class="dataset-header">
          <luzmo-search
            class="dataset-search"
            size="m"
            placeholder="Search datasets..."
            [value]="searchQuery"
            (input)="onSearchInput($event)"
          ></luzmo-search>

          <luzmo-action-group class="dataset-sort" size="xs" [quiet]="true">
            <luzmo-action-button
              value="name"
              [selected]="sortOption === 'name'"
              (click)="onSortClick('name')"
            >
              Name
              @if (sortOption === 'name') {
                <luzmo-icon slot="icon" size="xs" [icon]="sortIcon"></luzmo-icon>
              }
            </luzmo-action-button>
            <luzmo-action-button
              value="date"
              [selected]="sortOption === 'date'"
              (click)="onSortClick('date')"
            >
              Date
              @if (sortOption === 'date') {
                <luzmo-icon slot="icon" size="xs" [icon]="sortIcon"></luzmo-icon>
              }
            </luzmo-action-button>
          </luzmo-action-group>
        </div>

        @if (!isLoadingDatasets && datasets.length === 0 && searchQuery) {
          <div class="no-results">No matching datasets found for "{{ searchQuery }}"</div>
        } @else if (!isLoadingDatasets && datasets.length === 0) {
          <div class="no-results">No datasets available</div>
        } @else {
          <luzmo-options
            class="dataset-options"
            selects="single"
            variant="highlight"
            size="m"
            [pending]="isLoadingDatasets"
            [options]="$any(datasetOptions)"
            [value]="$any(selectedValue)"
            (change)="onOptionSelected($event)"
            (luzmo-scrolled)="onScrolled($event)"
          ></luzmo-options>
        }
      </div>
    </luzmo-popover>
  </luzmo-overlay>
</div>
